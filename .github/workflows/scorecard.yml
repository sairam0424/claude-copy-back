# OpenSSF Scorecard for copy-back.
#
# ossf/scorecard-action runs the Scorecard checks (pinned dependencies, token
# permissions, branch rules, dependency updates, security policy and the rest)
# against the repository as GitHub shows it and writes them as SARIF; upload-sarif
# puts the file on the Security tab (code scanning). Nothing is published
# anywhere else: publish_results is false, so no score is sent to the Scorecard
# API and there is no badge. Publishing later is more than a flag: the action's
# README then also forbids a `run:` step, workflow-level or job-level env and
# defaults, containers and services, and steps outside its approved list, and the
# job needs `id-token: write`. Read that README before changing publish_results.
#
# It is not a required check: ci.yml's ci-ok is the gate. The action reads the
# default branch only: it runs on pushes to main and once a week, and a manual run
# must be started on main (the action's README calls workflow_dispatch
# experimental, and a dispatch from another branch fails).
#
# Hardening is the same as ci.yml (tests/workflows.test.mts pins it): the
# workflow-level token is read-only, the one job that needs `security-events:
# write` asks for it by name, no secrets, actions pinned to full commit SHAs with
# their version beside them (verified with `gh api` on 2026-10-26; Dependabot
# keeps both current), persist-credentials off, and a timeout. Some checks
# (Branch-Protection, Code-Review) read settings that a read-only token may not
# be able to see; the action then reports them as inconclusive, which is expected.

name: scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "43 6 * * 3" # Wednesday 06:43 UTC, once a week
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scorecard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write # upload the results to code scanning
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false

      - name: Upload the results to code scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
